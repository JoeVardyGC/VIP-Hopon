# Netlify hosts the VIP HopOn screens (passenger app, crew app, ops dashboard).
# The server runs on Render; set VITE_API_URL in Netlify's site settings to the Render address.
[build]
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every path (/, /crew, /ops, /t/abc…) loads index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and the page itself must never be cached for long, or updates don't reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
